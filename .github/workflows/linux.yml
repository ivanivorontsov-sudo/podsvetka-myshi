name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости для проверки
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-3.0 python3-cairo python3-gi-cairo python3-xlib python3-dbus xwayland dpkg-dev xvfb xcompmgr x11-utils

      - name: Проверка Python и shell
        run: |
          set -euxo pipefail
          /usr/bin/python3 -m py_compile linux/podsvetka_myshi.py
          /usr/bin/python3 linux/podsvetka_myshi.py --self-test
          /usr/bin/python3 -m json.tool linux/kwin-script/metadata.json >/dev/null
          grep -q 'workspace.cursorPosChanged' linux/kwin-script/contents/code/main.js
          grep -q 'SetCursorPosition' linux/kwin-script/contents/code/main.js
          grep -q 'ring_alpha' linux/podsvetka_myshi.py
          grep -q 'KWIN_CLICK_EFFECT = "podsvetka-click"' linux/podsvetka_myshi.py
          grep -q 'isEffectSupported(KWIN_CLICK_EFFECT)' linux/podsvetka_myshi.py
          grep -q 'supportInformation(KWIN_CLICK_EFFECT)' linux/podsvetka_myshi.py
          grep -q 'def _ensure_kwin_mouseclick_loaded' linux/podsvetka_myshi.py
          grep -q '"Effect-" + KWIN_CLICK_EFFECT' linux/podsvetka_myshi.py
          grep -q 'KWIN_EFFECT_FACTORY(PodsvetkaClickEffect' linux/kwin-effect/podsvetka_click.cpp
          grep -q 'pressedNow' linux/kwin-effect/podsvetka_click.cpp
          ! grep -q 'isReleased' linux/kwin-effect/podsvetka_click.cpp
          ! grep -q 'oldButtons.*m_ringLife' linux/kwin-effect/podsvetka_click.cpp
          grep -q 'startMousePolling' linux/kwin-effect/podsvetka_click.cpp
          grep -q 'KWin::kwin' linux/kwin-effect/CMakeLists.txt
          grep -q 'ANIMATION_STYLES' linux/podsvetka_myshi.py
          grep -q 'set_animation_style' linux/podsvetka_myshi.py
          grep -q 'RadioMenuItem.new_with_label' linux/podsvetka_myshi.py
          grep -q 'Анимация щелчков' linux/podsvetka_myshi.py
          grep -q 'animation_style' linux/podsvetka_myshi.py
          grep -q 'Одиночный импульс — без паутины' linux/podsvetka_myshi.py
          grep -q 'RingCount.*ANIMATION_STYLES' linux/podsvetka_myshi.py
          grep -q 'count.*ANIMATION_STYLES' linux/podsvetka_myshi.py
          grep -q 'parse_kwin_mouseclick_state' linux/podsvetka_myshi.py
          grep -q 'mouseclickEnabled.*false' linux/podsvetka_myshi.py
          grep -q 'RingCount.*ANIMATION_STYLES' linux/podsvetka_myshi.py
          grep -q 'scripting.start()' linux/podsvetka_myshi.py
          grep -q 'APP + "Enabled"' linux/podsvetka_myshi.py
          ! grep -q 'scripting.loadScript(' linux/podsvetka_myshi.py
          grep -q '"Id": "podsvetka-myshi"' linux/kwin-script/metadata.json
          grep -q 'settings" if args.settings or not args.autostart' linux/podsvetka_myshi.py
          sh -n linux/launcher.sh
          bash -n linux/install.sh
          bash -n linux/uninstall.sh

      - name: GUI smoke test under Xvfb and X11 compositor
        run: |
          timeout 40s xvfb-run -a -s "-screen 0 1280x800x24 +extension Composite +extension RENDER" bash -euo pipefail -c '
            set -x
            xcompmgr -n >/tmp/podsvetka-xcompmgr.log 2>&1 &
            COMP_PID=$!
            APP_PID=""
            cleanup() {
              if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
                /usr/bin/python3 linux/podsvetka_myshi.py --quit || kill "$APP_PID" || true
              fi
              kill "$COMP_PID" 2>/dev/null || true
            }
            trap cleanup EXIT
            sleep 1
            echo "DIAGNOSTIC"
            /usr/bin/python3 linux/podsvetka_myshi.py --diagnose
            echo "START APP"
            /usr/bin/python3 linux/podsvetka_myshi.py --settings &
            APP_PID=$!
            FOUND=0
            for _ in $(seq 1 30); do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                wait "$APP_PID" || true
                echo "Application exited before its overlay window appeared."
                cat ~/.local/state/podsvetka-myshi/app.log 2>/dev/null || true
                exit 1
              fi
              if xwininfo -root -tree 2>/dev/null | grep -Fq "Подсветка мыши"; then
                FOUND=1
                break
              fi
              sleep 0.2
            done
            echo "OVERLAY FOUND=$FOUND"
            test "$FOUND" -eq 1
            DIALOG_FOUND=0
            for _ in $(seq 1 30); do
              if xwininfo -root -tree 2>/dev/null | grep -Fq "Настройки — Подсветка мыши"; then
                DIALOG_FOUND=1
                break
              fi
              sleep 0.2
            done
            echo "SETTINGS DIALOG FOUND=$DIALOG_FOUND"
            test "$DIALOG_FOUND" -eq 1
            echo "STOP APP WHILE SETTINGS DIALOG IS OPEN"
            /usr/bin/python3 linux/podsvetka_myshi.py --quit
            timeout 5s tail --pid="$APP_PID" -f /dev/null
            wait "$APP_PID"
            APP_PID=""
          '

      - name: Сборка press-only KWin effect для Debian 13 / KWin 6.3.6
        run: |
          set -euo pipefail
          mkdir -p build/deb
          docker run --rm -v "$PWD:/work" -w /work debian:trixie-slim bash -eu -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build extra-cmake-modules kwin-dev \
              qt6-base-dev libkf6coreaddons-dev
            cmake -S linux/kwin-effect -B build/kwin-effect -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build/kwin-effect --parallel 2
            DESTDIR=/work/build/deb cmake --install build/kwin-effect
            test -n "$(find /work/build/deb -type f -name "*podsvetka-click*.so" -print -quit)"
          '

      - name: Сборка Debian-пакета
        run: |
          set -euo pipefail
          VERSION="1.2.0"
          PKG="build/deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/podsvetka-myshi" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/doc/podsvetka-myshi" "$PKG/usr/share/kwin/scripts/podsvetka-myshi"
          install -m 755 linux/podsvetka_myshi.py "$PKG/usr/lib/podsvetka-myshi/podsvetka_myshi.py"
          install -m 755 linux/launcher.sh "$PKG/usr/bin/podsvetka-myshi-launch"
          cp -a linux/kwin-script/. "$PKG/usr/share/kwin/scripts/podsvetka-myshi/"
          cat > "$PKG/usr/bin/podsvetka-myshi" <<'EOF'
          #!/bin/sh
          exec /usr/bin/python3 /usr/lib/podsvetka-myshi/podsvetka_myshi.py "$@"
          EOF
          chmod 755 "$PKG/usr/bin/podsvetka-myshi"
          cat > "$PKG/usr/share/applications/podsvetka-myshi.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Подсветка мыши
          Comment=Подсветка курсора и круги при щелчке
          Exec=/usr/bin/podsvetka-myshi-launch
          Icon=input-mouse
          Terminal=false
          Categories=Utility;Accessibility;
          StartupNotify=false
          DBusActivatable=false
          EOF
          install -m 644 LICENSE "$PKG/usr/share/doc/podsvetka-myshi/copyright"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: podsvetka-myshi
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Ivan Vorontsov
          Depends: python3, python3-gi, gir1.2-gtk-3.0, python3-cairo, python3-gi-cairo, python3-xlib, python3-dbus, xwayland
          Suggests: libkwin6 (>= 4:6.3.6), libkwin6 (<< 4:6.4)
          Description: Mouse cursor highlight for X11 and KDE Wayland desktops
           Russian-language utility with a translucent cursor glow and click ripples.
           KDE Wayland uses a KWin effect that draws one animation on mouse button-down only.
           Supports X11/Xorg and KDE Plasma Wayland (KWin via XWayland and D-Bus).
          EOF
          dpkg-deb --root-owner-group --build "$PKG" "build/podsvetka-myshi_${VERSION}_amd64.deb"
          dpkg-deb --info "build/podsvetka-myshi_${VERSION}_amd64.deb"
          find "$PKG" -type f -name "*podsvetka-click*.so" -exec ldd {} ;
          sha256sum "build/podsvetka-myshi_${VERSION}_amd64.deb" > "build/podsvetka-myshi_${VERSION}_amd64.deb.sha256"

      - name: Загрузить Debian-пакет
        uses: actions/upload-artifact@v4
        with:
          name: podsvetka-myshi-linux-deb
          path: |
            build/podsvetka-myshi_*_amd64.deb
            build/podsvetka-myshi_*_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Добавить пакет в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/podsvetka-myshi_*_amd64.deb build/podsvetka-myshi_*_amd64.deb.sha256 --clobber
