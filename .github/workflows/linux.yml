name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости для проверки
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-3.0 python3-cairo python3-gi-cairo python3-xlib dpkg-dev xvfb xcompmgr x11-utils

      - name: Проверка Python и shell
        run: |
          /usr/bin/python3 -m py_compile linux/podsvetka_myshi.py
          /usr/bin/python3 linux/podsvetka_myshi.py --self-test
          sh -n linux/launcher.sh
          bash -n linux/install.sh
          bash -n linux/uninstall.sh

      - name: GUI smoke test under Xvfb and X11 compositor
        run: |
          timeout 40s xvfb-run -a -s "-screen 0 1280x800x24 +extension Composite +extension RENDER" bash -euo pipefail -c '
            set -x
            xcompmgr -n >/tmp/podsvetka-xcompmgr.log 2>&1 &
            COMP_PID=$!
            APP_PID=""
            cleanup() {
              if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
                /usr/bin/python3 linux/podsvetka_myshi.py --quit || kill "$APP_PID" || true
              fi
              kill "$COMP_PID" 2>/dev/null || true
            }
            trap cleanup EXIT
            sleep 1
            echo "DIAGNOSTIC"
            /usr/bin/python3 linux/podsvetka_myshi.py --diagnose
            echo "START APP"
            /usr/bin/python3 linux/podsvetka_myshi.py &
            APP_PID=$!
            FOUND=0
            for _ in $(seq 1 30); do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                wait "$APP_PID" || true
                echo "Application exited before its overlay window appeared."
                cat ~/.local/state/podsvetka-myshi/app.log 2>/dev/null || true
                exit 1
              fi
              if xwininfo -root -tree 2>/dev/null | grep -Fq "Подсветка мыши"; then
                FOUND=1
                break
              fi
              sleep 0.2
            done
            echo "OVERLAY FOUND=$FOUND"
            test "$FOUND" -eq 1
            echo "STOP APP"
            /usr/bin/python3 linux/podsvetka_myshi.py --quit
            timeout 5s tail --pid="$APP_PID" -f /dev/null
            wait "$APP_PID"
            APP_PID=""
          '

      - name: Сборка Debian-пакета
        run: |
          set -euo pipefail
          VERSION="1.0.4"
          PKG="build/deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/podsvetka-myshi" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/doc/podsvetka-myshi"
          install -m 755 linux/podsvetka_myshi.py "$PKG/usr/lib/podsvetka-myshi/podsvetka_myshi.py"
          install -m 755 linux/launcher.sh "$PKG/usr/bin/podsvetka-myshi-launch"
          cat > "$PKG/usr/bin/podsvetka-myshi" <<'EOF'
          #!/bin/sh
          exec /usr/bin/python3 /usr/lib/podsvetka-myshi/podsvetka_myshi.py "$@"
          EOF
          chmod 755 "$PKG/usr/bin/podsvetka-myshi"
          cat > "$PKG/usr/share/applications/podsvetka-myshi.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Подсветка мыши
          Comment=Подсветка курсора и круги при щелчке
          Exec=/usr/bin/podsvetka-myshi-launch
          Icon=input-mouse
          Terminal=false
          Categories=Utility;Accessibility;
          StartupNotify=false
          DBusActivatable=false
          EOF
          install -m 644 LICENSE "$PKG/usr/share/doc/podsvetka-myshi/copyright"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: podsvetka-myshi
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: Ivan Vorontsov
          Depends: python3, python3-gi, gir1.2-gtk-3.0, python3-cairo, python3-gi-cairo, python3-xlib
          Description: Mouse cursor highlight for X11 desktops
           Russian-language utility with a translucent cursor glow and click ripples.
           Supports X11/Xorg sessions with a compositing window manager.
          EOF
          dpkg-deb --root-owner-group --build "$PKG" "build/podsvetka-myshi_${VERSION}_all.deb"
          sha256sum "build/podsvetka-myshi_${VERSION}_all.deb" > "build/podsvetka-myshi_${VERSION}_all.deb.sha256"

      - name: Загрузить Debian-пакет
        uses: actions/upload-artifact@v4
        with:
          name: podsvetka-myshi-linux-deb
          path: |
            build/podsvetka-myshi_*_all.deb
            build/podsvetka-myshi_*_all.deb.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Добавить пакет в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/podsvetka-myshi_*_all.deb build/podsvetka-myshi_*_all.deb.sha256 --clobber
