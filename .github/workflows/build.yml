name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Сборка
        run: dotnet build PodsvetkaMyshi.slnx -c Release

      - name: Тесты
        run: dotnet test tests/PodsvetkaMyshi.Tests/PodsvetkaMyshi.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Дымовой тест (запуск, движение мыши, щелчки, снимки экрана)
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe src/PodsvetkaMyshi/bin/Release/net48/PodsvetkaMyshi.exe

      - name: Подготовка файлов
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/PodsvetkaMyshi/bin/Release/net48/PodsvetkaMyshi.exe dist/
          $h = (Get-FileHash dist/PodsvetkaMyshi.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PodsvetkaMyshi.exe" | Out-File -Encoding ascii dist/PodsvetkaMyshi.exe.sha256
          Write-Host "SHA-256: $h  размер: $((Get-Item dist/PodsvetkaMyshi.exe).Length) байт"

      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: PodsvetkaMyshi
          path: dist/
          retention-days: 3

      - uses: actions/upload-artifact@v5
        continue-on-error: true
        if: always()
        with:
          name: ui-shots
          path: ui-shots/
          if-no-files-found: ignore
          retention-days: 3

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/PodsvetkaMyshi.exe dist/PodsvetkaMyshi.exe.sha256 --clobber
          } else {
            gh release create $tag dist/PodsvetkaMyshi.exe dist/PodsvetkaMyshi.exe.sha256 --title "Подсветка мыши $tag" --notes-file RELEASE_NOTES.md
          }
